version: "2.1"

x-logging: &default-logging
  options:
    max-file: "1"
    compress: "false"
  driver: local

networks:
  traefik_proxy:
    external: true
  monitor-net:
    driver: bridge

volumes:
    subgraph-radio_data: {}

services:
  ######################################################################################
  #####################           SUBGRAPH RADIO CONTAINER            ##################
  ######################################################################################

  subgraph-radio:
    image: ghcr.io/graphops/subgraph-radio:1.0.6
    container_name: subgraph-radio
    expose:
      - 3010
      - 3012
    restart: unless-stopped
    environment:
      GRAPHCAST_NETWORK: ${GRAPHCAST_NETWORK:-mainnet}
      REGISTRY_SUBGRAPH: ${REGISTRY_SUBGRAPH_ENDPOINT}
      NETWORK_SUBGRAPH: ${INDEXER_AGENT_NETWORK_SUBGRAPH_ENDPOINT}
      MNEMONIC: ${OPERATOR_SEED_PHRASE}
      GRAPH_NODE_STATUS_ENDPOINT: ${GRAPH_NODE_STATUS_ENDPOINT:-http://index-node-0:8030/graphql}
      RUST_LOG: ${RUST_LOG:-warn,hyper=warn,graphcast_sdk=info,subgraph_radio=info}
      INDEXER_ADDRESS: ${STAKING_WALLET_ADDRESS}
      METRICS_HOST: ${METRICS_HOST:-0.0.0.0}
      METRICS_PORT: ${METRICS_PORT:-3010}
      SERVER_PORT: ${SERVER_PORT:-3012}
      ID_VALIDATION: ${ID_VALIDATION:-indexer}
      COVERAGE: ${COVERAGE:-comprehensive}
      SQLITE_FILE_PATH: ${SQLITE_FILE_PATH:-/data/state.sqlite}
    volumes:
      - subgraph-radio_data:/data
    networks:
      - monitor-net
    logging: *default-logging


  ######################################################################################
  #####################           POIFIER CONTAINER              #######################
  ######################################################################################

  poifier:
    image: grassets/poifier-client:v2.0.3
    container_name: poifier
    command:
      - "--poifier-server=https://poifier.io"
      - "--graph-node-status-endpoint=http://index-node-0:8030/graphql"
      - "--mnemonic=${OPERATOR_SEED_PHRASE}"
      - "--indexer-address=${STAKING_WALLET_ADDRESS}"
      - "--indexer-agent-epoch-subgraph-endpoint=${INDEXER_AGENT_EPOCH_SUBGRAPH_ENDPOINT:-https://api.thegraph.com/subgraphs/name/graphprotocol/arbitrum-epoch-block-oracle}"
    tty: true
    networks:
      - monitor-net
    restart: unless-stopped

  ######################################################################################
  #####################            INDEXER AGENT GUI             #######################
  ######################################################################################

  indexer-agent-gui:
    image: ${INDEXER_AGENT_GUI:-ghcr.io/stakemachine/indexer-agent-ui:v0.1.15}
    container_name: indexer-agent-gui
    expose:
      - 3000
    environment:
      - UI_LOGIN=${ADMIN_USER:-test}
      - UI_PASS=${ADMIN_PASSWORD:-pass}
      - AGENT_ENDPOINT=${INDEXER_AGENT_ENDPOINT:-http://indexer-agent:8000}
      - SUBGRAPH_ENDPOINT=${INDEXER_AGENT_NETWORK_SUBGRAPH_ENDPOINT:-https://api.thegraph.com/subgraphs/name/graphprotocol/graph-network-mainnet}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=https://${AGENT_GUI_HOST}/
    restart: unless-stopped
    networks:
      - monitor-net
      - traefik_proxy
    logging: *default-logging
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.services.indexer-agent-gui-${VOLUME_ID:-80}.loadbalancer.server.port=3000"
      - "traefik.http.routers.indexer-agent-gui-${VOLUME_ID:-80}.entrypoints=web"
      #- "traefik.http.routers.indexer-agent-gui-${VOLUME_ID:-80}.tls.certresolver=myresolver"
      - "traefik.http.routers.indexer-agent-gui-${VOLUME_ID:-80}.rule=Host(`$AGENT_GUI_HOST`)"

